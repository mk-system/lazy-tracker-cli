name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test and Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: Revisit runner labels after the GHEC migration; hosted runner names may change.
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The skill-flag step below diffs against the base branch, which needs
          # a merge base. A shallow clone has none.
          fetch-depth: 0

      # Hosted runners ship rustup, which installs the version pinned in
      # rust-toolchain.toml; no third-party toolchain action is needed.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          ./target/release/lt --version

      - name: Flag skill content changes for extra review
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `set -e` matters here: a failing `git diff` used to leave the
          # pipeline empty, which read as "skills/ is untouched" and let the
          # step pass without ever emitting the warning.
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if printf '%s\n' "$changed" | grep -q '^skills/'; then
            echo "::warning::skills/** changed — this ships as trusted AI-agent instructions (installed via 'lt skills install' into agent-trusted directories such as .claude/skills/). Lint/format/build do not check the safety of its natural-language content; please give this PR a maintainer content review beyond the standard code review."
          fi
