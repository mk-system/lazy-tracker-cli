name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Flag skill content changes for extra review
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^skills/'; then
            echo "::warning::skills/** changed — this ships as trusted AI-agent instructions (installed via 'lt skills install' into agent-trusted directories such as .claude/skills/). Lint/format/build do not check the safety of its natural-language content; please give this PR a maintainer content review beyond the standard code review."
          fi
