name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Lint and Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The skill-flag step below diffs against the base branch, which needs
          # a merge base. A shallow clone has none.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Flag skill content changes for extra review
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `set -e` matters here: a failing `git diff` used to leave the
          # pipeline empty, which read as "skills/ is untouched" and let the
          # step pass without ever emitting the warning.
          set -euo pipefail
          git fetch origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if printf '%s\n' "$changed" | grep -q '^skills/'; then
            echo "::warning::skills/** changed — this ships as trusted AI-agent instructions (installed via 'lt skills install' into agent-trusted directories such as .claude/skills/). Lint/format/build do not check the safety of its natural-language content; please give this PR a maintainer content review beyond the standard code review."
          fi
