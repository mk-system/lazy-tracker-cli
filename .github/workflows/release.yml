name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version
    # TODO: Revisit runner labels after the GHEC migration; hosted runner names may change.
    runs-on: &linux_x64 ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${crate_version}). Bump Cargo.toml first, merge that, then tag the merge commit."
            exit 1
          fi

      - name: Verify the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: verify-version
    strategy:
      matrix:
        # TODO: Revisit runner labels after the GHEC migration; hosted runner names may change.
        os: [*linux_x64, &macos macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Format check
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    strategy:
      matrix:
        # Linux builds link musl statically so the binaries do not depend on
        # the glibc version of the machine they are copied to.
        # TODO: Revisit runner labels after the GHEC migration; hosted runner names may change.
        # ubuntu-24.04-arm availability after the migration is also unconfirmed.
        include:
          - runner: *macos
            target: aarch64-apple-darwin
            artifact: lt-macos-arm64
            smoke: run
          - runner: *macos
            target: x86_64-apple-darwin
            artifact: lt-macos-x64
            smoke: file
          - runner: *linux_x64
            target: x86_64-unknown-linux-musl
            artifact: lt-linux-x64
            smoke: run
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: lt-linux-arm64
            smoke: run
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          cp "target/${TARGET}/release/lt" "dist/${ARTIFACT}"

      # The linker signs arm64 ad hoc but leaves x86_64 unsigned, and an
      # invalid signature gets the binary SIGKILLed on Apple Silicon.
      - name: Sign ad-hoc and verify
        if: runner.os == 'macOS'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          codesign --force --sign - "dist/${ARTIFACT}"
          codesign --verify --verbose "dist/${ARTIFACT}"

      - name: Smoke test
        env:
          ARTIFACT: ${{ matrix.artifact }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          if [ "$SMOKE" = run ]; then
            output=$("./dist/${ARTIFACT}" --version)
            echo "$output"
            case "$output" in
              *"${GITHUB_REF_NAME#v}"*) ;;
              *) echo "::error::--version printed '${output}', expected ${GITHUB_REF_NAME#v}"; exit 1 ;;
            esac
          else
            # x86_64 cannot run on this runner; check the architecture only.
            info=$(file "dist/${ARTIFACT}")
            echo "$info"
            case "$info" in
              *x86_64*) ;;
              *) echo "::error::dist/${ARTIFACT} is not an x86_64 binary"; exit 1 ;;
            esac
          fi

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: *linux_x64
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: lt-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: shasum -a 256 lt-* > SHA256SUMS

      # README links to releases/latest/download/... for every install.
      - name: Create GitHub Release
        working-directory: dist
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            lt-macos-arm64 lt-macos-x64 lt-linux-x64 lt-linux-arm64 SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
